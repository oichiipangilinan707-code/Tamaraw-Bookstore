 <div class="navbar">

<!--P1-->
    <h1>Contact Us</h1>
    <p><b>Email:</b> onceuponatamaraw@gmail.com</p>
    <p><b>Phone:</b> 0912-345-6789</p>
    <p><b>Facebook:</b> <a href="#">Once Upon a Tamaraw</a></p>

    <div class="box">
        <h2>Message Us</h2>
        <p>Name: <input type="text" id="name"></p>
        <p>Email: <input type="text" id="email"></p>
        <p>Message: <input type="text" id="msg"></p>
        <button onclick="send()">Submit</button>
        <p id="done"></p>
    </div>

<!--FOOTER-->
    <div class="footer">
        <p>© 2026 Once Upon a Tamaraw Bookstore</p>
    </div>

<!--JAVASCRIPT-->
    <script>
        function send() {
            var name = document.getElementById("name").value;
            var email = document.getElementById("email").value;
            var msg = document.getElementById("msg").value;

            if (name == "" || email == "" || msg == "") {
                alert("Please fill in everything!");
            } else {
                document.getElementById("done").innerHTML = "Message sent! Thank you " + name;
                alert("Sent!");
            }
        }
    </script>

</body>
